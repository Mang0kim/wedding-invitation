<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1003 Wedding Invitation</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: #333;
      text-align: center;
    }

    .card {
      width: min(88vw, 420px);
      padding: 64px 28px;
      background: #fff;
      border: 1px solid #e8e8e8;
      box-sizing: border-box;
    }

    .small {
      font-size: 13px;
      letter-spacing: 0.24em;
      color: #777;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .date {
      margin-top: 20px;
      font-size: 15px;
      color: #555;
    }

    .line {
      width: 32px;
      height: 1px;
      margin: 32px auto;
      background: #ddd;
    }

    p {
      margin: 0;
      font-size: 14px;
      line-height: 1.8;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="small">INVITATION</div>
    <h1>초대합니다</h1>
    <div class="date">2026.10.03</div>
    <div class="line"></div>
    <p>
      보규와 창수의 모바일 청첩장<br />
      준비 중입니다.
    </p>
  </main>
</body>
</html>
